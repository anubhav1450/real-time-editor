services:
  - type: web
    name: real-time-editor-server
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Your Vercel URL, e.g. https://real-time-editor.vercel.app
      # (comma separate several). Leave empty to allow any origin.
      - key: CLIENT_ORIGIN
        sync: false
