services:

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser connects to this URL, so it must be reachable from the host.
        VITE_SERVER_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
